name: Anoma
description: >-
  Anoma is a distributed operating system that abstracts blockchain complexity
  into a single intent-centric interface, letting developers build applications
  once and run them across any chain. It introduces generalized intents for
  improved UX, programmable and compliance-ready privacy, and the Anoma Resource
  Machine (ARM) for native intents, interoperability, and scaling. Anoma ships the
  TypeScript Anoma App SDK (@anomaorg/anoma-app-sdk) with typed HTTP API clients
  for transfers, on-chain resource indexing, and public-nullifier queries that
  power Anoma Pay and related privacy applications. Originally added to the API
  Evangelist network as a portfolio-lead stub, this profile has been enriched from
  Anoma's public developer surface.
